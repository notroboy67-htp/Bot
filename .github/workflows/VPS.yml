name: NRB VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-vps:
    name: Create NRB Container
    runs-on: ubuntu-24.04

    steps:
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io openssh-client curl

      - name: Create Ubuntu container
        run: |
          set -e

          # Generate login credentials automatically
          VPS_USERNAME="nrbuser"
          VPS_PASSWORD="$(openssl rand -hex 16)"

          # Start an Ubuntu container with SSH installed
          sudo docker run -d \
            --name nrb-vps \
            ubuntu:24.04 \
            sleep infinity

          sudo docker exec nrb-vps bash -c \
            "apt-get update && \
             DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server sudo"

          sudo docker exec nrb-vps bash -c \
            "useradd -m -s /bin/bash '$VPS_USERNAME' && \
             echo '$VPS_USERNAME:$VPS_PASSWORD' | chpasswd"

          sudo docker exec nrb-vps mkdir -p /run/sshd
          sudo docker exec nrb-vps ssh-keygen -A

          echo "=================================="
          echo "          NRB VPS"
          echo "=================================="
          echo "Container: nrb-vps"
          echo "Username: $VPS_USERNAME"
          echo "Password: $VPS_PASSWORD"
          echo "=================================="

      - name: Display runner IPv4
        run: |
          echo "Runner outbound IPv4:"
          curl -4 -fsS https://api.ipify.org
          echo
          echo "This is not a dedicated VPS public IP."
