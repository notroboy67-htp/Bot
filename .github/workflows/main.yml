name: NRB VPS with SSHX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-vps:
    name: NRB VPS Setup
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Update Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget tmux htop neofetch

      - name: Display System Information
        run: |
          echo "================================"
          echo "          NRB VPS"
          echo "================================"
          uname -a
          free -h
          df -h /

      - name: Start SSHX Terminal
        run: |
          set -e
          curl -sSf https://sshx.io/get | sh -s run
